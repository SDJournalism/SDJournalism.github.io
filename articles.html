(function(){
  try {
    var t = localStorage.getItem("sd-theme");
    var dark;
    if (t === "dark" || t === "light") {
      dark = t === "dark";
    } else {
      var h = new Date().getHours();
      dark = h >= 21 || h < 7;
    }
    if (dark) document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) {}
})();
</script>
