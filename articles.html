<body>

<header class="masthead">
  <div class="wrap masthead-inner">
    <a class="logo" href="index.html">
      <img src="images/logo-badge.png" alt="" class="logo-badge">
      <span class="logo-name">
        <span class="js-site-name">Samuel Davies</span>
        <span class="kicker js-tagline">Football Writer &amp; Analyst</span>
      </span>
    </a>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="articles.html" class="active">Articles</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="section-head">
    <div>
      <span class="eyebrow" id="articles-eyebrow">All articles</span>
      <h2 id="articles-heading">Match previews, reports, analysis, scouting &amp; opinion</h2>
    </div>

    <aside class="stats-panel" id="stats-panel">
      <span class="eyebrow">By the numbers</span>
      <div class="stats-panel-value" id="stats-value"></div>
      <div class="stats-panel-label" id="stats-label"></div>
    </aside>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" data-filter="All">All</button>
    <button class="filter-btn" data-filter="Match Preview">Match Preview</button>
    <button class="filter-btn" data-filter="Match Report">Match Report</button>
    <button class="filter-btn" data-filter="Analysis">Analysis</button>
    <button class="filter-btn" data-filter="Opinion">Opinion</button>
    <button class="filter-btn" data-filter="Scouting Report">Scouting Report</button>
  </div>

  <div class="dropdown-filter-row">
    <select id="team-filter" class="dropdown-filter"></select>
    <select id="competition-filter" class="dropdown-filter"></select>
    <button id="reset-filters" class="reset-filters-btn" type="button" hidden>Reset all filters &times;</button>
  </div>

  <div class="search-wrap">
    <input type="text" id="article-search" class="search-input" placeholder="Search all articles...">
    <button id="search-clear" class="search-clear-btn" type="button" aria-label="Clear search" hidden>&times;</button>
  </div>

  <div class="article-grid" id="article-grid"></div>
</div>

<footer class="mega-footer" id="mega-footer"></footer>

<script src="js/contact-info.js"></script>

<script>
  renderArticleList();
  setupFilters();
  setupSearch();
  setupResetFilters();
  renderTeamFilter("team-filter");
  renderCompetitionFilter("competition-filter");
  renderStatsPanel("stats-value", "stats-label");
  renderMegaFooter("mega-footer", "articles");
  renderKicker();
  initThemeToggle("theme-toggle");
</script>
