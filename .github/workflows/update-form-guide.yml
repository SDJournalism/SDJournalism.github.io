name: Update Recent Form data

# Keeps form-guide-data.json fresh automatically -- see
# scripts/fetch-form-guide.js for what it actually does.

on:
  schedule:
    # 00:00, 06:00, 12:00 and 18:00 UTC every day
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-form-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest form data
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/fetch-form-guide.js

      - name: Commit updated data file (only if it changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add form-guide-data.json
          git diff --cached --quiet || git commit -m "Auto-update recent form data"
          git push
